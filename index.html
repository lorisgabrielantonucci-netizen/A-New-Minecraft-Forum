    <title>A New Minecraft Forum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #261e14; background-image: radial-gradient(#3a2e1e 15%, transparent 16%), radial-gradient(#1c150d 15%, transparent 16%); background-size: 30px 30px; color: #e0e0e0; }
        .top-bar { background-color: #4a7c21; border-bottom: 4px solid #2e5212; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar nav { display: flex; gap: 10px; }
        .top-bar nav button { background: transparent; border: none; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .top-bar nav button.active { background: #2e5212; border-radius: 3px; }
        .btn-discord { background-color: #5865F2 !important; color: white !important; border-radius: 3px; text-decoration: none; font-weight: bold; padding: 6px 12px; font-size: 0.9rem; }
        .container { max-width: 950px; margin: 30px auto; background-color: rgba(26, 26, 26, 0.95); border: 2px solid #333; border-radius: 4px; padding: 20px; }
        header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #333; margin-bottom: 20px; }
        header h1 { font-size: 2.5rem; color: #5b9d24; text-shadow: 2px 2px 0px #000; }
        input[type="text"], textarea { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 3px; margin-bottom: 10px; }
        textarea { height: 70px; resize: vertical; }
        .btn-green { background: #4a7c21; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .forum-header-action { display: flex; justify-content: space-between; background: #4a7c21; padding: 10px; border-radius: 3px 3px 0 0; font-weight: bold; }
        .create-thread-box { display: none; background: #222; border: 1px solid #4a7c21; padding: 15px; margin-bottom: 20px; }
        .thread-card { background: #222; border: 1px solid #333; margin-top: 10px; padding: 15px; border-radius: 3px; }
        .thread-card h3 { color: #4ba3e3; margin-bottom: 5px; }
        .thread-meta { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
        .comments-box { background: #181818; padding: 10px; border-left: 3px solid #4a7c21; margin-top: 10px; }
        .comment-item { font-size: 0.85rem; padding: 5px 0; border-bottom: 1px solid #2a2a2a; }
        .chat-container { background: #1b1b1b; border: 1px solid #333; border-radius: 4px; }
        .chat-box { height: 350px; padding: 15px; overflow-y: auto; background: #111; }
        .chat-message { margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .chat-form { display: flex; gap: 10px; padding: 15px; background: #222; }
    </style>
