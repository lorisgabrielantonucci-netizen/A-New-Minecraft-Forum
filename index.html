<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A New Minecraft Forum</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #261e14;
            background-image: 
                radial-gradient(#3a2e1e 15%, transparent 16%),
                radial-gradient(#1c150d 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #e0e0e0;
        }

        .top-bar {
            background-color: #4a7c21;
            border-bottom: 4px solid #2e5212;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar .logo-text {
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
        }

        .top-bar nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar nav button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
        }

        .top-bar nav button.active {
            background: #2e5212;
            border-radius: 3px;
        }

        .btn-discord {
            background-color: #5865F2 !important;
            color: white !important;
            border-radius: 3px;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            background-color: rgba(26, 26, 26, 0.95);
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 15px 0 25px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #5b9d24;
            text-shadow: 2px 2px 0px #000;
        }

        .discord-banner {
            background: #2f3136;
            border: 1px solid #5865F2;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .btn-green {
            background: #4a7c21;
            color: white;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .forum-header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #4a7c21, #386118);
            padding: 10px 15px;
            border-radius: 3px 3px 0 0;
            font-weight: bold;
        }

        .create-thread-box {
            display: none;
            background: #222;
            border: 1px solid #4a7c21;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .thread-card {
            background: #222;
            border: 1px solid #333;
            margin-top: 10px;
            padding: 15px;
            border-radius: 3px;
        }

        .thread-card h3 { color: #4ba3e3; margin-bottom: 5px; }
        .thread-meta { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
        .thread-content { font-size: 0.95rem; color: #ddd; margin-bottom: 15px; white-space: pre-wrap; }
        .thread-image { max-width: 100%; max-height: 400px; border: 2px solid #444; border-radius: 4px; margin-bottom: 15px; display: block; }
        .comments-box { background: #181818; padding: 10px; border-left: 3px solid #4a7c21; margin-top: 10px; }
        .comment-item { font-size: 0.85rem; padding: 5px 0; border-bottom: 1px solid #2a2a2a; }
        .comment-author { color: #5b9d24; font-weight: bold; }

        .chat-container { background: #1b1b1b; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .chat-box { height: 350px; padding: 15px; overflow-y: auto; background: #111; }
        .chat-message { margin-bottom: 10px; font-size: 0.9rem; padding-bottom: 5px; border-bottom: 1px solid #222; }
        .chat-message .author { color: #4ba3e3; font-weight: bold; }
        .chat-message .time { color: #666; font-size: 0.75rem; margin-left: 5px; }
        .chat-form { display: flex; gap: 10px; padding: 15px; background: #222; }
        .chat-form input[type="text"] { margin-bottom: 0; }
    </style>

    <!-- INTEGRATIONE FIREBASE (DATABASE CLOUD) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ========================================================
        // INCOLLA QUI LE TUE CHIAVI PRESE DA FIREBASE CONSOLE
        // ========================================================
        const firebaseConfig = {
            apiKey: "TUO_API_KEY",
            authDomain: "TUO_PROGETTO.firebaseapp.com",
            databaseURL: "https://TUO_PROGETTO-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "TUO_PROGETTO",
            storageBucket: "TUO_PROGETTO.appspot.com",
            messagingSenderId: "TUO_SENDER_ID",
            appId: "TUO_APP_ID"
        };
        // ========================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Riferimenti alle tabelle sul Database Online
        const threadsRef = ref(db, 'threads');
        const chatRef = ref(db, 'chat');

        // Legge i thread online per TUTTI gli utenti
        onValue(threadsRef, (snapshot) => {
            const data = snapshot.val();
            const threadsList = document.getElementById('threadsList');
            threadsList.innerHTML = '';
            
            if (data) {
                const threadsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                threadsArray.forEach(t => {
                    const imgTag = t.imageUrl ? `<img src="${escapeHtml(t.imageUrl)}" class="thread-image" alt="Immagine" onerror="this.style.display='none'">` : '';
                    const comments = t.comments ? Object.values(t.comments) : [];

                    const threadHTML = `
                        <div class="thread-card">
                            <h3>${escapeHtml(t.title)}</h3>
                            <div class="thread-meta">Inviato da <strong>${escapeHtml(t.author)}</strong></div>
                            <div class="thread-content">${escapeHtml(t.content)}</div>
                            ${imgTag}

                            <div class="comments-box">
                                <strong style="font-size:0.8rem; color:#aaa;">Risposte (${comments.length}):</strong>
                                <div style="margin-top: 5px;">
                                    ${comments.map(c => `
                                        <div class="comment-item">
                                            <span class="comment-author">${escapeHtml(c.author)}:</span> ${escapeHtml(c.text)}
                                        </div>
                                    `).join('')}
                                </div>
                                <div style="display:flex; gap: 5px; margin-top: 10px;">
                                    <input type="text" id="comment-input-${t.id}" placeholder="Rispondi..." style="margin-bottom:0;">
                                    <button class="btn-green" onclick="addComment('${t.id}')">Rispondi</button>
                                </div>
                            </div>
                        </div>
                    `;
                    threadsList.innerHTML += threadHTML;
                });
            } else {
                threadsList.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Nessun thread presente. Creane uno per primo!</p>';
            }
        });

        // Legge la chat online per TUTTI gli utenti
        onValue(chatRef, (snapshot) => {
            const data = snapshot.val();
            const box = document.getElementById('chatBox');
            box.innerHTML = '';

            if (data) {
                Object.values(data).forEach(m => {
                    const msgHTML = `
                        <div class="chat-message">
                            <span class="author">${escapeHtml(m.author)}</span> 
                            <span class="time">[${m.time || ''}]</span>: 
                            <span>${escapeHtml(m.text)}</span>
                        </div>
                    `;
                    box.innerHTML += msgHTML;
                });
                box.scrollTop = box.scrollHeight;
            }
        });

        // Invia nuovo thread al database
        window.createThread = function() {
            const user = document.getElementById('globalUser').value.trim() || 'Anonimo';
            const title = document.getElementById('threadTitle').value.trim();
            const imageUrl = document.getElementById('threadImage').value.trim();
            const content = document.getElementById('threadContent').value.trim();

            if (!title || !content) {
                alert("Inserisci titolo e contenuto!");
                return;
            }

            push(threadsRef, {
                author: user,
                title: title,
                imageUrl: imageUrl,
                content: content,
                timestamp: Date.now()
            });

            document.getElementById('threadTitle').value = '';
            document.getElementById('threadImage').value = '';
            document.getElementById('threadContent').value = '';
            toggleCreateBox();
        };

        // Invia nuovo commento al database
        window.addComment = function(threadId) {
            const user = document.getElementById('globalUser').value.trim() || 'Anonimo';
            const input = document.getElementById(`comment-input-${threadId}`);
            const text = input.value.trim();

            if (!text) return;

            const threadCommentsRef = ref(db, `threads/${threadId}/comments`);
            push(threadCommentsRef, {
                author: user,
                text: text
            });
        };

        // Invia nuovo messaggio in chat al database
        window.sendChatMessage = function() {
            const user = document.getElementById('globalUser').value.trim() || 'Anonimo';
            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (!text) return;

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            push(chatRef, {
                author: user,
                text: text,
                time: timeStr
            });

            input.value = '';
        };

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</head>
<body>

    <div class="top-bar">
        <div class="logo-text">Minecraft Forum</div>
        <nav>
            <button class="active" onclick="switchTab('forumTab', this)">📋 Forum</button>
            <button onclick="switchTab('chatTab', this)">💬 Chat Generale</button>
            <a href="https://discord.gg/B9DuYpWbB4" target="_blank" class="btn-discord">🎮 Entra nel Discord</a>
        </nav>
    </div>

    <div class="container">
        <header>
            <h1>A New Minecraft Forum</h1>
            <p>La tua community per discutere e chattare su Minecraft!</p>
        </header>

        <div class="discord-banner">
            <div>
                <h4 style="color:#5865F2;">Unisciti al nostro Server Discord!</h4>
                <p style="font-size:0.85rem; color:#aaa;">Chat vocale, aggiornamenti e supporto direttamente dal tuo server preferito.</p>
            </div>
            <a href="https://discord.gg/TUO-LINK" target="_blank" class="btn-discord">Unisciti Ora</a>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.85rem; color: #aaa;">Il tuo Nickname:</label>
            <input type="text" id="globalUser" value="Steve" style="width: 200px; display: inline-block; margin-left: 10px;">
        </div>

        <!-- CATEGORIA 1: FORUM -->
        <div id="forumTab" class="tab-content active">
            <div class="forum-header-action">
                <span>Discussioni del Forum</span>
                <button class="btn-green" onclick="toggleCreateBox()">+ Crea Thread</button>
            </div>

            <div id="createBox" class="create-thread-box">
                <h3 style="color:#5b9d24; margin-bottom:10px;">Nuovo Thread</h3>
                <input type="text" id="threadTitle" placeholder="Titolo della discussione...">
                <input type="text" id="threadImage" placeholder="URL Immagine (opzionale)">
                <textarea id="threadContent" placeholder="Contenuto del post..."></textarea>
                <button class="btn-green" onclick="createThread()">Pubblica Thread</button>
            </div>

            <div id="threadsList"></div>
        </div>

        <!-- CATEGORIA 2: CHAT GENERALE -->
        <div id="chatTab" class="tab-content">
            <div class="forum-header-action">
                <span>Chat Generale Live</span>
            </div>
            <div class="chat-container">
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-form">
                    <input type="text" id="chatInput" placeholder="Scrivi un messaggio..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                    <button class="btn-green" onclick="sendChatMessage()">Invia</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleCreateBox() {
            const box = document.getElementById('createBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
