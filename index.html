<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A New Minecraft Forum</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Sfondo stile Minecraft */
        body {
            background-color: #261e14;
            background-image: 
                radial-gradient(#3a2e1e 15%, transparent 16%),
                radial-gradient(#1c150d 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .top-bar {
            background-color: #4a7c21;
            border-bottom: 4px solid #2e5212;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar .logo-text {
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px #000;
        }

        .top-bar nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar nav button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 3px;
        }

        .top-bar nav button.active {
            background: #2e5212;
        }

        .btn-discord {
            background-color: #5865F2 !important;
            color: white !important;
            border-radius: 3px;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-discord:hover {
            background-color: #4752C4 !important;
        }

        /* Contenitore principale del Forum */
        .container {
            max-width: 950px;
            margin: 30px auto;
            background-color: #1a1a1a;
            border: 2px solid #444;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            padding: 25px;
        }

        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #5b9d24;
            text-shadow: 2px 2px 0px #000;
        }

        header p {
            color: #aaa;
            margin-top: 5px;
        }

        .discord-banner {
            background: #2f3136;
            border: 1px solid #5865F2;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .btn-green {
            background: #4a7c21;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-green:hover {
            background: #5b9d24;
        }

        .tab-content { 
            display: none; 
        }

        .tab-content.active { 
            display: block; 
        }

        .forum-header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #4a7c21, #386118);
            padding: 12px 15px;
            border-radius: 4px 4px 0 0;
            font-weight: bold;
        }

        .create-thread-box {
            display: none;
            background: #222;
            border: 1px solid #4a7c21;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .thread-card {
            background: #222;
            border: 1px solid #333;
            margin-top: 15px;
            padding: 15px;
            border-radius: 4px;
        }

        .thread-card h3 { 
            color: #4ba3e3; 
            margin-bottom: 5px; 
        }

        .thread-meta { 
            font-size: 0.8rem; 
            color: #888; 
            margin-bottom: 10px; 
        }

        .thread-content {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .comments-box { 
            background: #151515; 
            padding: 12px; 
            border-left: 3px solid #4a7c21; 
            margin-top: 10px; 
            border-radius: 0 4px 4px 0;
        }

        .comment-item { 
            font-size: 0.85rem; 
            padding: 6px 0; 
            border-bottom: 1px solid #262626; 
        }

        .chat-container { 
            background: #1b1b1b; 
            border: 1px solid #333; 
            border-radius: 4px; 
            overflow: hidden; 
        }

        .chat-box { 
            height: 350px; 
            padding: 15px; 
            overflow-y: auto; 
            background: #111; 
        }

        .chat-message { 
            margin-bottom: 10px; 
            font-size: 0.9rem; 
            border-bottom: 1px solid #222; 
            padding-bottom: 5px; 
        }

        .chat-form { 
            display: flex; 
            gap: 10px; 
            padding: 15px; 
            background: #222; 
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ========================================================
        // SOSTITUISCI QUESTI DATI CON QUELLI DEL TUO FIREBASE!
        // ========================================================
        const firebaseConfig = {
            apiKey: "TUO_API_KEY",
            authDomain: "TUO_PROGETTO.firebaseapp.com",
            databaseURL: "https://TUO_PROGETTO-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "TUO_PROGETTO",
            storageBucket: "TUO_PROGETTO.appspot.com",
            messagingSenderId: "TUO_SENDER_ID",
            appId: "TUO_APP_ID"
        };
        // ========================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const threadsRef = ref(db, 'threads');
        const chatRef = ref(db, 'chat');

        // Caricamento dei Thread da Firebase
        onValue(threadsRef, (snapshot) => {
            const data = snapshot.val();
            const threadsList = document.getElementById('threadsList');
            threadsList.innerHTML = '';
            
            if (data) {
                const threadsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                threadsArray.forEach(t => {
                    const comments = t.comments ? Object.values(t.comments) : [];
                    const imgTag = t.imageUrl ? `<img src="${escapeHtml(t.imageUrl)}" style="max-width:100%; max-height:350px; border-radius:4px; margin-bottom:10px; display:block;" onerror="this.style.display='none'">` : '';

                    const threadHTML = `
                        <div class="thread-card">
                            <h3>${escapeHtml(t.title)}</h3>
                            <div class="thread-meta">Inviato da <strong>${escapeHtml(t.author)}</strong></div>
                            <div class="thread-content">${escapeHtml(t.content)}</div>
                            ${imgTag}
                            <div class="comments-box">
                                <strong style="font-size:0.8rem; color:#aaa;">Risposte (${comments.length}):</strong>
                                <div style="margin-top:5px;">
                                    ${comments.map(c => `
                                        <div class="comment-item">
                                            <strong style="color:#5b9d24;">${escapeHtml(c.author)}:</strong>${escapeHtml(c.text)}
                                        </div>
                                    `).join('')}
                                </div>
                                <div style="display:flex; gap: 5px; margin-top: 10px;">
                                    <input type="text" id="comment-input-${t.id}" placeholder="Scrivi una risposta..." style="margin-bottom:0;">
                                    <button class="btn-green" onclick="addComment('${t.id}')">Rispondi</button>
                                </div>
                            </div>
                        </div>
                    `;
                    threadsList.innerHTML += threadHTML;
                });
            } else {
                threadsList.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Nessuna discussione trovata. Creane una per primo!</p>';
            }
        });

        // Caricamento della Chat da Firebase
        onValue(chatRef, (snapshot) => {
            const data = snapshot.val();
            const box = document.getElementById('chatBox');
            box.innerHTML = '';

            if (data) {
                Object.values(data).forEach(m => {
                    box.innerHTML += `
                        <div class="chat-message">
                            <strong style="color:#4ba3e3;">${escapeHtml(m.author)}</strong> 
                            <span style="color:#666; font-size:0.75rem;">[${m.time || ''}]</span>: 
                            <span>${escapeHtml(m.text)}</span>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            }
        });

        // Invio Thread
        window.createThread = function() {
            const user = document.getElementById('globalUser').value.trim() || 'Anonimo';
            const title = document.getElementById('threadTitle').value.trim();
            const imageUrl = document.getElementById('threadImage').value.trim();
            const content = document.getElementById('threadContent').value.trim();

            if (!title || !content) {
                alert("Compila il titolo e il contenuto!");
                return;
            }

            push(threadsRef, {
                author: user,
                title: title,
                imageUrl: imageUrl,
                content: content,
                timestamp: Date.now()
            });

            document.getElementById('threadTitle').value = '';
            document.getElementById('threadImage').value = '';
            document.getElementById('threadContent').value = '';
            toggleCreateBox();
        };

        window.addComment = function(threadId) {
            const user = document.getElementById('globalUser').value.trim() || 'Anonimo';
            const input =
